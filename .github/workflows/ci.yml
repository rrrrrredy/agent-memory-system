name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/opencode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: integrations/opencode
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/agentmem
      - name: Verify PowerShell quickstart lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/quickstart-smoke.ps1
      - name: Verify POSIX quickstart lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/quickstart-smoke.sh
      - name: Test Windows install and upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Test macOS install and upgrade
        if: runner.os == 'macOS'
        shell: bash
        run: sh ./scripts/test-install.sh
      - run: pnpm test
        working-directory: integrations/opencode
      - run: pnpm typecheck
        working-directory: integrations/opencode
      - name: Check macOS installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  public-tree-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch protected main, tags, and the current pull request
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          if [ -n "${PR_NUMBER}" ]; then
            git fetch --force origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
          fi
      - name: Reject private data and machine traces from the public tree and history
        run: go run ./cmd/public-tree-check --root . --history

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Race-test stateful safety boundaries
        run: >-
          go test -race
          ./internal/ledger
          ./internal/review
          ./internal/promotion
          ./internal/portable
          ./internal/retrieval
          ./internal/capturesupervisor
          ./internal/agentbridge
          ./internal/loadout
          ./internal/reviewpacket
          ./internal/study
          ./internal/dashboard

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz secret scanning invariants
        run: >-
          go test ./internal/secretscan
          -run '^$' -fuzz '^FuzzScan$' -fuzztime 10s

  dsh-bundle:
    name: dsh-bundle-${{ matrix.os }}-node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - "22.19.0"
          - "24.19.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: integrations/deepseek-harness/pnpm-lock.yaml
      - name: Install exact Bundle dependencies
        working-directory: integrations/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Verify Bundle protocol and real Cordis composition
        working-directory: integrations/deepseek-harness
        run: pnpm verify
      - name: Build Agent Memory CLI for integration
        shell: pwsh
        run: |
          $suffix = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $binary = Join-Path $env:RUNNER_TEMP ("agentmem" + $suffix)
          go build -trimpath -o $binary ./cmd/agentmem
          "AGENTMEM_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENT_MEMORY_DSH_TEST_TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import a real Bundle spool through the CLI
        working-directory: integrations/deepseek-harness
        run: pnpm test:integration

  opencode-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pinned OpenCode in runner temp
        run: >-
          npm install
          --prefix "$RUNNER_TEMP/opencode-runtime"
          --no-audit
          --no-fund
          opencode-ai@1.18.11
      - name: Build agentmem
        run: go build -o "$RUNNER_TEMP/agentmem" ./cmd/agentmem
      - name: Verify OpenCode plugin to evidence ledger
        env:
          AGENTMEM_BINARY: ${{ runner.temp }}/agentmem
          OPENCODE_BINARY: ${{ runner.temp }}/opencode-runtime/node_modules/.bin/opencode
          OPENCODE_DISABLE_MODELS_FETCH: "true"
        run: node integrations/opencode/runtime-smoke.mjs
