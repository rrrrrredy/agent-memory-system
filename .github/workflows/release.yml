name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer candidate label, for example v0.1.0-rc.1
        required: true
        default: v0.1.0-rc.1
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/opencode/pnpm-lock.yaml
      - name: Validate candidate label
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version must be SemVer without build metadata." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: integrations/opencode
      - run: go test ./...
      - run: go vet ./...
      - run: sh ./scripts/quickstart-smoke.sh
      - run: pnpm test
        working-directory: integrations/opencode
      - run: pnpm typecheck
        working-directory: integrations/opencode
      - name: Build candidate archives
        shell: bash
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="agentmem_${VERSION}_${goos}_${goarch}"
            directory="dist/${name}"
            mkdir -p "${directory}"
            binary="agentmem"
            if [ "${goos}" = "windows" ]; then
              binary="agentmem.exe"
            fi
            GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${build_date}" \
              -o "${directory}/${binary}" ./cmd/agentmem
            cp LICENSE README.md "${directory}/"
            git archive HEAD docs schemas integrations scripts | tar -x -C "${directory}"
            for capability in adapters/*/CAPABILITIES.md; do
              install -D "${capability}" "${directory}/${capability}"
            done
            if [ "${goos}" = "windows" ]; then
              (cd "${directory}" && zip -q -r "../${name}.zip" .)
            else
              tar -C "${directory}" -czf "dist/${name}.tar.gz" .
            fi
          done
          (cd dist && sha256sum ./*.zip ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agentmem-${{ inputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
